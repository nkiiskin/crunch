# Crunch configuration file, read by crunch, crunch-pp, and crunch-ld.
#
# include_path = dir[:dir...]
#     Header search directories in addition to the built-in directory. The
#     full search order is: -I directories, $CRUNCH_INCLUDE_PATH, the built-in
#     directory, then the directories listed here. The line may be repeated;
#     directories are appended in order.
#
# include_path = /usr/local/include/crunch
#
# library_path = @PREFIX@/lib
#     Library search directories, separated by colons. Repeated lines
#     append directories. They replace the compiled-in PREFIX/lib default;
#     command-line -L directories are searched first.
#     crunch-ld also searches each directory's crunch subdirectory for its
#     automatically linked runtime, followed by its installation runtime path.
#
# assembler = gnu | crunch
# linker = gnu | crunch
#     Choose tools for the compiler driver. The last occurrence wins.
#     Defaults are selected at configure time: GNU as and ld when detected,
#     otherwise crunch-as and crunch-ld; --enable-native-only selects Crunch.
#     The crunch driver option --with-crunch-as overrides the assembler setting.
#     Configure --with-default-assembler=gnu|crunch sets the driver default.
#     crunch-ld is experimental; its relocatable links have limitations.
#
# assembler_path = /usr/bin/as
# linker_path = /usr/bin/ld
# archiver_path = /usr/bin/ar
#     Absolute executable paths overriding the selected tools. The last
#     occurrence wins. Set assembler/linker above to match the tool's interface.
#     --with-crunch-as overrides assembler_path as well.
#     The archiver is used by crunch --archive; its default is selected by
#     configure (GNU ar when detected, otherwise crunch-ar beside the driver).
