name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CRUNCH_COLOR: never
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure
        run: ./configure
      - name: Build
        run: make
      - name: Test
        run: make check
